# Render Blueprint for AI好签 2.0

services:
  - type: web
    name: ai-lingqian-v2
    runtime: node
    region: singapore
    plan: free
    autoDeploy: true
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        value: sk-5a01f0b335954cc650109a7b59d3144fa5a5465c4bbbb74090182f0e38ef09b2
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-4-turbo
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: NODE_ENV
        value: production