# Render Blueprint for AI灵签 2.0

services:
  - type: web
    name: ai-lingqian-v2
    runtime: node
    region: singapore
    plan: free
    autoDeploy: true
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: NODE_ENV
        value: production