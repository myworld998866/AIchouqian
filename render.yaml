# Render Blueprint for AI灵签 2.0

services:
  - type: web
    name: ai-lingqian-v2
    runtime: node
    region: singapore
    plan: free
    autoDeploy: true
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        value: dummy-key
      - key: OPENAI_BASE_URL
        value: http://69.5.20.196:8080
      - key: OPENAI_MODEL
        value: gpt-5.4
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: NODE_ENV
        value: production