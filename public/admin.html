<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI好签 - 管理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a0a0a 0%, #2d1810 100%);
            min-height: 100vh;
            color: #F5E6D3;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #D4AF37;
            margin-bottom: 30px;
        }
        .card {
            background: rgba(139, 69, 19, 0.3);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card h2 {
            color: #D4AF37;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: rgba(245, 230, 211, 0.8);
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            color: #F5E6D3;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #D4AF37;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            flex: 1;
            min-width: 100px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-add { background: #4ade80; color: white; }
        .btn-set { background: #3b82f6; color: white; }
        .btn-reset { background: #f59e0b; color: white; }
        .btn-deduct { background: #ef4444; color: white; }
        button:hover { opacity: 0.9; transform: scale(1.02); }
        .result {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.4);
            font-size: 13px;
            word-break: break-all;
        }
        .result.success { border-left: 3px solid #4ade80; }
        .result.error { border-left: 3px solid #ef4444; }
        .credits-display {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }
        .credit-item {
            background: rgba(212, 175, 55, 0.2);
            padding: 10px 20px;
            border-radius: 8px;
            text-align: center;
        }
        .credit-value {
            font-size: 24px;
            color: #D4AF37;
            font-weight: bold;
        }
        .credit-label {
            font-size: 12px;
            color: rgba(245, 230, 211, 0.7);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔮 AI好签 管理后台</h1>
        
        <div class="card">
            <h2>📊 用户积分查询</h2>
            <div class="form-group">
                <label>用户ID (Telegram User ID)</label>
                <input type="text" id="userId" placeholder="输入用户ID">
            </div>
            <button class="btn-add" onclick="queryCredits()">查询</button>
            <div id="creditsResult" class="result" style="display:none;"></div>
        </div>

        <div class="card">
            <h2>⚙️ 管理操作</h2>
            <div class="form-group">
                <label>管理员密钥</label>
                <input type="password" id="adminKey" placeholder="输入管理员密钥">
            </div>
            <div class="form-group">
                <label>用户ID</label>
                <input type="text" id="targetUserId" placeholder="输入要管理的用户ID">
            </div>
            <div class="form-group">
                <label>抽签次数 (增加/设置/扣减的数值)</label>
                <input type="number" id="freeDraws" placeholder="例如: 5">
            </div>
            <div class="form-group">
                <label>AI解签次数 (增加/设置/扣减的数值)</label>
                <input type="number" id="aiUses" placeholder="例如: 3">
            </div>
            <div class="btn-group">
                <button class="btn-add" onclick="addCredits()">➕ 增加</button>
                <button class="btn-set" onclick="setCredits()">⚙️ 设置</button>
                <button class="btn-reset" onclick="resetCredits()">🔄 重置</button>
                <button class="btn-deduct" onclick="deductCredits()">➖ 扣减</button>
            </div>
            <div id="adminResult" class="result" style="display:none;"></div>
        </div>

        <div class="card">
            <h2>📝 操作说明</h2>
            <p style="font-size:13px; color:rgba(245,230,211,0.7); line-height:1.6;">
                <strong>增加 (add):</strong> 在现有基础上增加积分<br>
                <strong>设置 (set):</strong> 直接设置积分为指定值<br>
                <strong>重置 (reset):</strong> 重置为默认值 (抽签3次, AI解签1次)<br>
                <strong>扣减 (deduct):</strong> 从现有积分中扣减<br><br>
                <strong>默认管理员密钥:</strong> admin123
            </p>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        async function queryCredits() {
            const userId = document.getElementById('userId').value.trim();
            if (!userId) {
                showResult('creditsResult', '请输入用户ID', false);
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/api/credits/${userId}`);
                const data = await res.json();
                if (data.success) {
                    showCreditsResult(data.credits);
                } else {
                    showResult('creditsResult', JSON.stringify(data), false);
                }
            } catch (e) {
                showResult('creditsResult', '查询失败: ' + e.message, false);
            }
        }

        function showCreditsResult(credits) {
            const el = document.getElementById('creditsResult');
            el.innerHTML = `
                <div>用户: ${document.getElementById('userId').value}</div>
                <div class="credits-display">
                    <div class="credit-item">
                        <div class="credit-value">${credits.freeDraws}</div>
                        <div class="credit-label">抽签次数</div>
                    </div>
                    <div class="credit-item">
                        <div class="credit-value">${credits.aiUses}</div>
                        <div class="credit-label">AI解签次数</div>
                    </div>
                    <div class="credit-item">
                        <div class="credit-value">${credits.totalDraws}</div>
                        <div class="credit-label">累计抽签</div>
                    </div>
                </div>
            `;
            el.style.display = 'block';
            el.className = 'result success';
        }

        async function adminOperation(action) {
            const adminKey = document.getElementById('adminKey').value;
            const userId = document.getElementById('targetUserId').value.trim();
            
            if (!adminKey || !userId) {
                showResult('adminResult', '请填写完整信息', false);
                return;
            }

            const freeDraws = parseInt(document.getElementById('freeDraws')?.value) || 0;
            const aiUses = parseInt(document.getElementById('aiUses')?.value) || 0;

            try {
                const res = await fetch(`${API_BASE}/api/credits/${userId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        adminKey, 
                        action,
                        freeDraws: freeDraws || undefined,
                        aiUses: aiUses || undefined
                    })
                });
                const data = await res.json();
                if (data.success) {
                    showResult('adminResult', `${data.message}\n抽签: ${data.credits.freeDraws}, AI: ${data.credits.aiUses}`, true);
                } else {
                    showResult('adminResult', `失败: ${data.error || data.code}`, false);
                }
            } catch (e) {
                showResult('adminResult', '操作失败: ' + e.message, false);
            }
        }

        function addCredits() { adminOperation('add'); }
        function setCredits() { adminOperation('set'); }
        function resetCredits() { adminOperation('reset'); }
        function deductCredits() { adminOperation('deduct'); }

        function showResult(id, msg, success) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.style.display = 'block';
            el.className = 'result ' + (success ? 'success' : 'error');
        }
    </script>
</body>
</html>
