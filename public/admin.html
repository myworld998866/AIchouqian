<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔮 AI好签 - Admin 管理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 40px; }
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: #888; margin-top: 10px; }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .card-title { font-size: 1.2rem; font-weight: 600; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }
        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stat-label { color: #888; margin-top: 5px; }
        .user-list { display: grid; gap: 12px; }
        .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .user-info { flex: 1; }
        .user-id { font-family: monospace; color: #f093fb; margin-bottom: 4px; }
        .user-meta { font-size: 0.85rem; color: #888; }
        .user-credits { display: flex; align-items: center; gap: 12px; }
        .credits-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4); }
        .btn-small { padding: 6px 12px; font-size: 0.85rem; }
        .input-group { display: flex; gap: 12px; margin-top: 16px; }
        .input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 1rem;
        }
        .input:focus { outline: none; border-color: #667eea; }
        .empty-state { text-align: center; padding: 40px; color: #888; }
        .loading { text-align: center; padding: 20px; color: #888; }
        .refresh-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }
        .refresh-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-content {
            background: #1a1a2e;
            padding: 24px;
            border-radius: 16px;
            max-width: 400px;
            width: 90%;
        }
        .modal-title { margin-bottom: 20px; font-size: 1.2rem; }
        .modal-actions { display: flex; gap: 12px; margin-top: 20px; }
        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔮 AI好签 Admin</h1>
            <p class="subtitle">管理后台 - 用户抽签次数管理</p>
        </header>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="total-users">0</div>
                <div class="stat-label">总用户数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-draws">0</div>
                <div class="stat-label">总抽签次数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="default-times">3</div>
                <div class="stat-label">默认次数</div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <span class="card-title">⚙️ 默认抽签次数设置</span>
            </div>
            <div class="input-group">
                <input type="number" class="input" id="default-times-input" min="0" placeholder="设置默认次数">
                <button class="btn btn-primary" onclick="updateDefaultTimes()">保存</button>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <span class="card-title">👥 用户列表</span>
                <button class="refresh-btn" onclick="loadUsers()">🔄 刷新</button>
            </div>
            <div id="user-list" class="user-list">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </div>
    
    <div id="edit-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-title">✏️ 设置用户抽签次数</div>
            <input type="hidden" id="edit-user-id">
            <div class="input-group">
                <input type="number" class="input" id="edit-draws-input" min="0" placeholder="抽签次数">
                <input type="number" class="input" id="edit-ai-input" min="0" placeholder="AI次数">
            </div>
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="saveUserCredits()">保存</button>
                <button class="btn btn-danger" onclick="closeModal()">取消</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '';
        let users = [];
        
        async function loadUsers() {
            const listEl = document.getElementById('user-list');
            listEl.innerHTML = '<div class="loading">加载中...</div>';
            
            try {
                const response = await fetch(`${API_BASE}/api/admin/users`);
                const data = await response.json();
                
                if (data.success) {
                    users = data.users;
                    renderUsers(data);
                } else {
                    listEl.innerHTML = '<div class="empty-state">加载失败</div>';
                }
            } catch (error) {
                console.error('加载用户失败:', error);
                listEl.innerHTML = '<div class="empty-state">网络错误，请刷新重试</div>';
            }
        }
        
        function renderUsers(data) {
            document.getElementById('total-users').textContent = data.total || 0;
            document.getElementById('default-times').textContent = data.defaultTimes || 0;
            document.getElementById('default-times-input').value = data.defaultTimes || 0;
            
            const listEl = document.getElementById('user-list');
            
            if (!users || users.length === 0) {
                listEl.innerHTML = '<div class="empty-state">暂无用户数据</div>';
                return;
            }
            
            const totalDraws = users.reduce((sum, u) => sum + (u.totalDraws || 0), 0);
            document.getElementById('total-draws').textContent = totalDraws;
            
            listEl.innerHTML = users.map(user => `
                <div class="user-item">
                    <div class="user-info">
                        <div class="user-id">${user.userId}</div>
                        <div class="user-meta">
                            创建: ${formatDate(user.createdAt)}
                            ${user.lastDrawAt ? ` | 最后抽签: ${formatDate(user.lastDrawAt)}` : ''}
                        </div>
                    </div>
                    <div class="user-credits">
                        <span class="credits-badge">抽签: ${user.freeDraws} | AI: ${user.aiUses}</span>
                        <button class="btn btn-primary btn-small" onclick="openEditModal('${user.userId}', ${user.freeDraws}, ${user.aiUses})">编辑</button>
                    </div>
                </div>
            `).join('');
        }
        
        function formatDate(dateStr) {
            if (!dateStr) return '无';
            const date = new Date(dateStr);
            return date.toLocaleString('zh-CN');
        }
        
        function openEditModal(userId, freeDraws, aiUses) {
            document.getElementById('edit-user-id').value = userId;
            document.getElementById('edit-draws-input').value = freeDraws;
            document.getElementById('edit-ai-input').value = aiUses;
            document.getElementById('edit-modal').classList.remove('hidden');
        }
        
        function closeModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }
        
        async function saveUserCredits() {
            const userId = document.getElementById('edit-user-id').value;
            const freeDraws = parseInt(document.getElementById('edit-draws-input').value);
            const aiUses = parseInt(document.getElementById('edit-ai-input').value);
            
            if (isNaN(freeDraws) || freeDraws < 0 || isNaN(aiUses) || aiUses < 0) {
                showToast('请输入有效的数字');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/admin/credits/${userId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        freeDraws,
                        aiUses,
                        action: 'set',
                        adminKey: 'admin123'
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast('设置成功！');
                    closeModal();
                    loadUsers();
                } else {
                    showToast('设置失败: ' + (data.error || '未知错误'));
                }
            } catch (error) {
                showToast('网络错误');
            }
        }
        
        async function updateDefaultTimes() {
            const times = parseInt(document.getElementById('default-times-input').value);
            
            if (isNaN(times) || times < 0) {
                showToast('请输入有效的数字');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/admin/default-times`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ times, adminKey: 'admin123' })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showToast('默认次数已更新为 ' + times);
                    document.getElementById('default-times').textContent = times;
                } else {
                    showToast('设置失败');
                }
            } catch (error) {
                showToast('网络错误');
            }
        }
        
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'fadeIn 0.3s ease reverse';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }
        
        document.getElementById('edit-modal').addEventListener('click', (e) => {
            if (e.target.id === 'edit-modal') closeModal();
        });
        
        loadUsers();
    </script>
</body>
</html>
